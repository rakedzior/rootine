name: iOS visual review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ROOTINE_SCREENSHOT_DIR: rootine-visual-review
      ROOTINE_ENVIRONMENT: development
      ROOTINE_CONTRACT_VERSION: "3"
      ROOTINE_FLAG_NORMALIZED_SYNC: disabled-by-default
      ROOTINE_FLAG_NORMALIZED_READ: disabled-by-default
      ROOTINE_FLAG_NOTIFICATIONS: disabled-by-default

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show selected toolchain
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime and device
        run: |
          set -euo pipefail

          ios_runtimes="$(xcrun simctl list runtimes | sed -n '/^iOS /p' | sed '/unavailable/d')"
          if [ -z "$ios_runtimes" ]; then
            echo "No available iOS simulator runtime found; downloading the Xcode-matched platform."
            xcodebuild -downloadPlatform iOS
            ios_runtimes="$(xcrun simctl list runtimes | sed -n '/^iOS /p' | sed '/unavailable/d')"
          fi

          runtime_id="$(printf '%s\n' "$ios_runtimes" | sed -E 's/.* - (com.apple.CoreSimulator.SimRuntime.iOS-[^ ]+).*/\1/' | head -n 1)"
          if [ -z "$runtime_id" ]; then
            echo "Unable to identify an available iOS simulator runtime."
            xcrun simctl list runtimes
            exit 1
          fi

          device_type_id="$(xcrun simctl list devicetypes | awk -F '[()]' '$1 ~ /iPhone 17 Pro/ {print $2; exit}')"
          if [ -z "$device_type_id" ]; then
            echo "The iPhone 17 Pro simulator device type is not installed."
            xcrun simctl list devicetypes
            exit 1
          fi

          device_id="$(xcrun simctl list devices available | awk -F '[()]' '{label=$1; gsub(/^[ \t]+|[ \t]+$/, "", label); if (label == "iPhone 17 Pro") {print $2; exit}}')"
          if [ -z "$device_id" ]; then
            device_id="$(xcrun simctl create "iPhone 17 Pro" "$device_type_id" "$runtime_id")"
            echo "Created iPhone 17 Pro simulator: $device_id"
          fi

          echo "Using iOS runtime: $runtime_id"
          echo "Using iPhone 17 Pro simulator: $device_id"
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Prepare screenshot directory
        run: mkdir -p "$ROOTINE_SCREENSHOT_DIR"

      - name: Capture primary tab screenshots
        run: >-
          xcodebuild test
          -project ios/Rootine/Rootine.xcodeproj
          -scheme Rootine
          -configuration Development
          -only-testing:RootineUITests/VisualReviewUITests/testCapturePrimaryTabs
          -destination "platform=iOS Simulator,name=iPhone 17 Pro"
          -derivedDataPath "$RUNNER_TEMP/RootineVisualReviewDerivedData"
          -resultBundlePath "$RUNNER_TEMP/RootineVisualReview.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Export XCTest screenshot attachments
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/RootineVisualReview.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/RootineVisualReview.xcresult" \
              --output-path "$ROOTINE_SCREENSHOT_DIR"
          else
            echo "No XCTest result bundle was produced."
          fi

      - name: Normalize XCTest screenshot names
        if: always()
        run: node scripts/normalize-ios-visual-review.mjs "$ROOTINE_SCREENSHOT_DIR"

      - name: Validate exported screenshot set
        if: always()
        run: node scripts/validate-ios-visual-review.mjs "$ROOTINE_SCREENSHOT_DIR"

      - name: Upload screenshot and test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-visual-review-${{ github.sha }}
          path: |
            rootine-visual-review
            ${{ runner.temp }}/RootineVisualReview.xcresult
            ${{ runner.temp }}/RootineVisualReviewDerivedData/Logs/Test
          if-no-files-found: error
          retention-days: 14
