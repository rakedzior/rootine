name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - AUDITFULL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint, typecheck web and API, test, and build
        run: npm run check

  browser-regressions:
    name: Browser regressions (${{ matrix.suite.name }} ${{ matrix.suite.shard }})
    runs-on: ${{ matrix.suite.os }}
    timeout-minutes: 15
    env:
      VITE_ROOTINE_QA_AUTH: "1"
    strategy:
      fail-fast: true
      matrix:
        suite:
          - name: core
            os: windows-latest
            args: --project=desktop-1440 --project=mobile-390
            shard: 1/4
          - name: core
            os: windows-latest
            args: --project=desktop-1440 --project=mobile-390
            shard: 2/4
          - name: core
            os: windows-latest
            args: --project=desktop-1440 --project=mobile-390
            shard: 3/4
          - name: core
            os: windows-latest
            args: --project=desktop-1440 --project=mobile-390
            shard: 4/4
          - name: viewport
            os: ubuntu-latest
            args: --grep @viewport-matrix
            shard: 1/4
          - name: viewport
            os: ubuntu-latest
            args: --grep @viewport-matrix
            shard: 2/4
          - name: viewport
            os: ubuntu-latest
            args: --grep @viewport-matrix
            shard: 3/4
          - name: viewport
            os: ubuntu-latest
            args: --grep @viewport-matrix
            shard: 4/4
          - name: zoom
            os: ubuntu-latest
            args: --grep @zoom-matrix
            shard: 1/2
          - name: zoom
            os: ubuntu-latest
            args: --grep @zoom-matrix
            shard: 2/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build browser test bundle
        run: npm run build:e2e

      - name: Run ${{ matrix.suite.name }} browser regressions
        run: npx playwright test ${{ matrix.suite.args }} --shard=${{ matrix.suite.shard }}
