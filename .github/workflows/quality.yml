name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - AUDITFULL

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck web and API, test, and build
        run: npm run check

  browser-regressions:
    name: Browser regressions (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: core
            command: npx playwright test --project=desktop-1440 --project=mobile-390
          - name: viewport
            command: npm run test:e2e:viewport
          - name: zoom
            command: npm run test:e2e:zoom

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.suite.name }} browser regressions
        run: ${{ matrix.suite.command }}
